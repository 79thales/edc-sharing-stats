name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-home-assistant:
    name: Latest stable Home Assistant compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install exact latest stable HA from PyPI
        run: |
          requirement="$(python scripts/latest_ha_requirement.py)"
          python -m pip install "$requirement"
      - name: Run compatibility checks without skipping HA
        run: python -m unittest tests.test_home_assistant_compatibility -v

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile integration and packaging script
        run: python -m compileall -q custom_components/edc_sharing scripts
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  home-assistant-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        home-assistant-version:
          - "2026.8.0"
          - "2026.9.0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Home Assistant ${{ matrix.home-assistant-version }}
        run: pip install "homeassistant==${{ matrix.home-assistant-version }}"
      - name: Import integration against Home Assistant
        run: python -m unittest tests.test_home_assistant_compatibility -v

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
