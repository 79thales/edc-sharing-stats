name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-test-environments:
    name: Resolve exact HA dashboard test environments
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - id: resolve
        run: |
          matrix="$(python -c 'import json; from scripts.resolve_ha_tests import resolve_environment; print(json.dumps({"include": [resolve_environment()]}))')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  dashboard-minimum-home-assistant:
    name: Dashboard and billing tests – HA 2026.8.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install exact matching minimum HA test environment
        run: >-
          python -m pip install
          "homeassistant==2026.8.0"
          "pytest-homeassistant-custom-component==0.13.354"
      - name: Install declared integration requirements
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          requirements = json.loads(Path("custom_components/edc_sharing/manifest.json").read_text())["requirements"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", *requirements])
          PY
      - name: Install the frontend required by this exact HA release
        run: |
          requirement="$(python -c 'import json; from pathlib import Path; import homeassistant; print(json.loads((Path(homeassistant.__file__).parent / "components/frontend/manifest.json").read_text())["requirements"][0])')"
          python -m pip install "$requirement"
      - name: Test real HA permissions, dashboard creation, billing storage and SMTP
        run: |
          python -m pip install "playwright==1.64.0"
          python -m playwright install --with-deps chromium
          pytest tests_homeassistant -q --basetemp=test-output
      # Pouze syntetické grafy testovacího HA, žádný browser profil/HAR/token.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hourly-native-graphs-minimum
          path: test-output/**/hourly-graph.png
          retention-days: 7

  dashboard-home-assistant:
    name: Dashboard and billing tests – HA ${{ matrix.homeassistant }}
    needs: dashboard-test-environments
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.dashboard-test-environments.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact matching HA test environment
        run: >-
          python -m pip install
          "homeassistant==${{ matrix.homeassistant }}"
          "pytest-homeassistant-custom-component==${{ matrix.test_plugin }}"
      - name: Install declared integration requirements
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          requirements = json.loads(Path("custom_components/edc_sharing/manifest.json").read_text())["requirements"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", *requirements])
          PY
      - name: Install the frontend required by this exact HA release
        run: |
          requirement="$(python -c 'import json; from pathlib import Path; import homeassistant; print(json.loads((Path(homeassistant.__file__).parent / "components/frontend/manifest.json").read_text())["requirements"][0])')"
          python -m pip install "$requirement"
      - name: Test real HA permissions, dashboard creation, billing storage and SMTP
        run: |
          python -m pip install "playwright==1.64.0"
          python -m playwright install --with-deps chromium
          pytest tests_homeassistant -q --basetemp=test-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hourly-native-graphs-${{ matrix.homeassistant }}
          path: test-output/**/hourly-graph.png
          retention-days: 7

  latest-home-assistant:
    name: Latest stable Home Assistant compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install exact latest stable HA from PyPI
        run: |
          requirement="$(python scripts/latest_ha_requirement.py)"
          python -m pip install "$requirement"
      - name: Run compatibility checks without skipping HA
        run: python -m unittest tests.test_home_assistant_compatibility -v

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile integration and packaging script
        run: python -m compileall -q custom_components/edc_sharing scripts
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate and test the dashboard frontend
        run: |
          node --check custom_components/edc_sharing/frontend/dashboard-generator.js
          node tests/test_dashboard_frontend.js
          node --check custom_components/edc_sharing/frontend/billing.js
          node tests/test_billing_frontend.js
      - name: Lint the additive billing feature
        run: |
          python -m pip install "ruff==0.16.6"
          python -m ruff check custom_components/edc_sharing/billing.py custom_components/edc_sharing/billing_api.py custom_components/edc_sharing/billing_document.py tests/test_billing.py tests_homeassistant/test_billing.py
      - name: Lint API contract and observability
        run: python -m ruff check custom_components/edc_sharing/api.py custom_components/edc_sharing/api_policy.py custom_components/edc_sharing/calculation.py custom_components/edc_sharing/health.py custom_components/edc_sharing/diagnostics.py custom_components/edc_sharing/portal_contract.py custom_components/edc_sharing/calendar_maintenance.py scripts/check_edc_portal.py scripts/probe_edc_portal.py tests/test_api_resilience.py tests/test_portal_contract.py tests/test_portal_probe.py tests/test_calendar_maintenance.py tests_homeassistant/test_statistics_health.py tests_homeassistant/test_api_wire.py tests_homeassistant/test_hourly_browser.py

  public-portal-monitor:
    # Pouze existující denní/ruční běh; bez účtu a bez tajných proměnných.
    # Výsledek je advisory JSON: nový build není prokázaná změna API.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Observe public portal build
        run: python scripts/check_edc_portal.py --calendar --output edc-public-check.json
      - uses: actions/upload-artifact@v4
        with:
          name: edc-public-portal-observation
          path: edc-public-check.json
          retention-days: 14

  home-assistant-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        home-assistant-version:
          - "2026.8.0"
          - "2026.9.0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Home Assistant ${{ matrix.home-assistant-version }}
        run: pip install "homeassistant==${{ matrix.home-assistant-version }}"
      - name: Import integration against Home Assistant
        run: python -m unittest tests.test_home_assistant_compatibility -v

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
